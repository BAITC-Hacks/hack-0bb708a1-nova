[client]
toolbarMode = "minimal"

[theme]
font = "sans-serif"
baseRadius = "0.5rem"
buttonRadius = "0.375rem"
headingFontSizes = ["1.5rem", "1.3rem", "1.15rem"]
showWidgetBorder = true

[theme.light]
primaryColor = "#4F6F9F"
backgroundColor = "#FAFBFC"
secondaryBackgroundColor = "#F2F4F7"
textColor = "#20242A"
borderColor = "#DDE1E7"

[theme.dark]
primaryColor = "#8EACD3"
backgroundColor = "#17191D"
secondaryBackgroundColor = "#22252B"
textColor = "#ECEEF2"
borderColor = "#3C414A"